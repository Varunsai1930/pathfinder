[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pathfinder-api"
version = "0.1.0"
description = "Pathfinder API for grounded technology-career exploration"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1.0",
  "httpx>=0.28,<1.0",
  "openai>=1.0,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "pytest>=8.4,<9.0",
  "ruff>=0.6,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: FastAPI's Depends()/HTTPBearer() in defaults is the framework idiom.
# UP042: StrEnum migration risks pydantic serialization of the certainty enum.
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# conftest applies warning filters before imports on purpose (import-time warnings).
"tests/conftest.py" = ["E402"]
# personalization.py holds long LLM prompt/fallback prose; rewrapping it hurts
# diff review of the exact text sent to the model more than width hurts here.
"app/personalization.py" = ["E501"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
